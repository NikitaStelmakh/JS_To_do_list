<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">  
    </head>
    <body>
        <main id="main_section">
            <section id="add_section">
                <h1>Список задач</h1>
                <form id="task_form">
                  <input type="text" id="task" placeholder="Новая задача">
                  <button type="submit" class="btn" id="add_btn">добавить</button>
                </form>
            </section>
            <section id="task_section">
                <div id="task_block">
                    <ul id="task_list">
            
                    </ul>
                </div>
                <div id="task_stat">
                    <div class="stat">
                        <span class="stat_label">выполненные</span>
                        <span class="count">01</span>
                    </div>
                    <div class="stat">
                         <span class="stat_label">невыполненные</span>
                         <span class="count">01</span>
                    </div>
                    <div class="stat">
                         <span class="stat_label">отклоненные</span>
                         <span class="count">01</span>
                    </div>

                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
